<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedRandevu — Hesap Oluştur</title>
  <meta name="description" content="MedRandevu Hastane Randevu Sistemi — Yeni hesap oluşturun.">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/tr.js"></script>
</head>
<body>

  <div class="auth-page">
    <div class="auth-container">

      <!-- Ana Sayfaya Dön -->
      <a href="index.html" class="auth-back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Ana Sayfaya Dön
      </a>


      <!-- Brand -->
      <div class="auth-brand">
        <div class="auth-brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
        </div>
        <h1>MedRandevu</h1>
        <p>Yeni Hesap Oluştur</p>
      </div>

      <!-- Register Card -->
      <div class="auth-card">
        <form class="auth-form" id="register-form" novalidate>

          <!-- Patient Name -->
          <div class="form-group">
            <label class="form-label" for="name-input">Ad Soyad <span class="required">*</span></label>
            <div class="input-with-icon">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <input type="text" class="form-input" id="name-input" placeholder="Adınız ve soyadınız" required>
            </div>
            <span class="form-error" id="name-error"></span>
          </div>

          <!-- TC -->
          <div class="form-group">
            <label class="form-label" for="tc-input">TC Kimlik Numarası <span class="required">*</span></label>
            <div class="input-with-icon">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="5" width="20" height="14" rx="2"/>
                <line x1="2" y1="10" x2="22" y2="10"/>
              </svg>
              <input type="text" class="form-input" id="tc-input" placeholder="11 haneli TC kimlik numaranız" maxlength="11" required>
            </div>
            <span class="form-error" id="tc-error"></span>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="password-input">Şifre <span class="required">*</span></label>
            <div class="input-with-icon">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input type="password" class="form-input" id="password-input" placeholder="En az 6 karakter" required>
            </div>
            <span class="form-error" id="password-error"></span>
          </div>

          <!-- Date of Birth & Gender Row -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4);">
            <div class="form-group">
              <label class="form-label" for="dob-input">Doğum Tarihi <span class="required">*</span></label>
              <input type="date" class="form-input" id="dob-input" lang="en-US" style="direction: ltr; font-family: sans-serif;" required>
              <span class="form-error" id="dob-error"></span>
            </div>
            <div class="form-group">
              <label class="form-label" for="gender-input">Cinsiyet <span class="required">*</span></label>
              <select class="form-select" id="gender-input" required>
                <option value="" disabled selected>Seçiniz</option>
                <option value="Erkek">Erkek</option>
                <option value="Kadın">Kadın</option>
              </select>
              <span class="form-error" id="gender-error"></span>
            </div>
          </div>

          <!-- Phone -->
          <div class="form-group">
            <label class="form-label" for="phone-input">Telefon</label>
            <div class="input-with-icon">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
              </svg>
              <input type="tel" class="form-input" id="phone-input" maxlength="11" pattern="[0-9]{10,11}" placeholder="05XXXXXXXXX">
            </div>
            <span class="form-hint">İsteğe bağlı</span>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn btn-primary btn-lg btn-block" id="register-btn">
            Hesap Oluştur
          </button>
        </form>

        <!-- Login Link -->
        <div class="auth-footer">
          Zaten hesabınız var mı? <a href="login.html">Giriş Yap</a>
          <div style="margin-top: 8px;">veya <a href="index.html">Ana Sayfaya Dön</a></div>
        </div>
      </div>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    redirectIfLoggedIn();

    const form = document.getElementById('register-form');
    const registerBtn = document.getElementById('register-btn');

    // Set max date for Date of Birth (Must be at least 18 years old) using Flatpickr
    document.addEventListener('DOMContentLoaded', () => {
      const dobInput = document.getElementById('dob-input');
      if (dobInput) {
        const eighteenYearsAgo = new Date();
        eighteenYearsAgo.setFullYear(new Date().getFullYear() - 18);
        
        flatpickr(dobInput, {
          locale: "tr",
          dateFormat: "Y-m-d",
          maxDate: eighteenYearsAgo,
          disableMobile: "true" // Force desktop view to avoid native Arabic datepicker on mobile
        });
      }
    });

    // TC input — only digits
    document.getElementById('tc-input').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/\D/g, '');
    });

    // Phone input — only digits
    document.getElementById('phone-input').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/\D/g, '');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Clear errors
      document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
      document.querySelectorAll('.form-input, .form-select').forEach(el => el.classList.remove('is-error'));

      const name = document.getElementById('name-input').value.trim();
      const tc = document.getElementById('tc-input').value.trim();
      const password = document.getElementById('password-input').value;
      const dob = document.getElementById('dob-input').value;
      const gender = document.getElementById('gender-input').value;
      const phone = document.getElementById('phone-input').value.trim();

      // Validation
      let valid = true;

      if (!name) {
        document.getElementById('name-error').textContent = 'Ad Soyad zorunludur.';
        document.getElementById('name-input').classList.add('is-error');
        valid = false;
      }
      if (!tc || tc.length !== 11) {
        document.getElementById('tc-error').textContent = 'TC Kimlik numarası 11 haneli olmalıdır.';
        document.getElementById('tc-input').classList.add('is-error');
        valid = false;
      }
      if (!password || password.length < 6) {
        document.getElementById('password-error').textContent = 'Şifre en az 6 karakter olmalıdır.';
        document.getElementById('password-input').classList.add('is-error');
        valid = false;
      }
      if (!dob) {
        document.getElementById('dob-error').textContent = 'Doğum tarihi zorunludur.';
        document.getElementById('dob-input').classList.add('is-error');
        valid = false;
      }
      if (!gender) {
        document.getElementById('gender-error').textContent = 'Cinsiyet seçiniz.';
        document.getElementById('gender-input').classList.add('is-error');
        valid = false;
      }

      if (!valid) return;

      const data = {
        TC: tc,
        Password: password,
        PatientName: name,
        DateOfBirth: dob,
        Gender: gender,
        Phone: phone || null,
      };

      setButtonLoading(registerBtn, true);
      try {
        const result = await AuthAPI.register(data);
        if (result.ok) {
          showToast('Hesabınız başarıyla oluşturuldu! Giriş yapabilirsiniz.', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        } else {
          showToast(result.data || 'Kayıt oluşturulamadı. Lütfen tekrar deneyin.', 'danger');
        }
      } catch (err) {
        showToast(err.message, 'danger');
      } finally {
        setButtonLoading(registerBtn, false);
      }
    });
  </script>

</body>
</html>
